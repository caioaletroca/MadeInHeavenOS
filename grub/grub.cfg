set timeout=0
# Entry to boot (no menu with timeout=0): 0 automatic tests, 1 interactive tests
# (they wait for typing), 2 shell. Commit with 0.
set default=0

# Modules: module2 <file on the ISO> <install path> [arguments]
# The kernel starts /sbin/init with its module string as argv; init runs its
# arguments as one command (program, then that program's arguments). Every
# other line only makes a program available to spawn by its install path
# (boot modules stand in for files until the initramfs). At most
# BOOT_MODULE_MAX (kernel/include/boot_info.h) modules per entry.
# hello must be in every entry: the ELF self-test loads it.
menuentry "MadeInHeavenOS" {
	multiboot2 /boot/mihos.kernel
	module2 /boot/sbin/init.elf /sbin/init /usr/tests/run
	module2 /boot/usr/tests/run.elf /usr/tests/run
	module2 /boot/usr/tests/hello.elf /usr/tests/hello
	module2 /boot/usr/tests/stdio.elf /usr/tests/stdio
	module2 /boot/usr/tests/brk.elf /usr/tests/brk
	module2 /boot/usr/tests/malloc.elf /usr/tests/malloc
	module2 /boot/usr/tests/malloc_abort.elf /usr/tests/malloc_abort
	module2 /boot/usr/tests/stdin.elf /usr/tests/stdin
	module2 /boot/usr/tests/args.elf /usr/tests/args
	module2 /boot/usr/tests/spawn.elf /usr/tests/spawn
	boot
}

menuentry "MadeInHeavenOS (interactive tests)" {
	multiboot2 /boot/mihos.kernel
	module2 /boot/sbin/init.elf /sbin/init /usr/tests/run interactive
	module2 /boot/usr/tests/run.elf /usr/tests/run
	module2 /boot/usr/tests/hello.elf /usr/tests/hello
	module2 /boot/usr/tests/stdin_interactive.elf /usr/tests/stdin_interactive
	boot
}

menuentry "MadeInHeavenOS (shell)" {
	multiboot2 /boot/mihos.kernel
	module2 /boot/sbin/init.elf /sbin/init /bin/sh
	module2 /boot/bin/sh.elf /bin/sh
	module2 /boot/usr/tests/run.elf /usr/tests/run
	module2 /boot/usr/tests/hello.elf /usr/tests/hello
	module2 /boot/usr/tests/stdio.elf /usr/tests/stdio
	module2 /boot/usr/tests/brk.elf /usr/tests/brk
	module2 /boot/usr/tests/malloc.elf /usr/tests/malloc
	module2 /boot/usr/tests/malloc_abort.elf /usr/tests/malloc_abort
	module2 /boot/usr/tests/stdin.elf /usr/tests/stdin
	module2 /boot/usr/tests/args.elf /usr/tests/args
	module2 /boot/usr/tests/spawn.elf /usr/tests/spawn
	module2 /boot/bin/echo.elf /bin/echo
	boot
}

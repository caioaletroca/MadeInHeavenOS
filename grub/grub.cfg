set timeout=0
set default=0

# Modules: module2 <file on the ISO> <name> [expected exit status]
# The name is the program's install path; the kernel runs every module in this
# order and compares its exit status with the expected one (0 when omitted).
# At most BOOT_MODULE_MAX (kernel/include/boot_info.h) modules.
menuentry "MadeInHeavenOS" {
	multiboot2 /boot/mihos.kernel
	module2 /boot/usr/tests/hello.elf /usr/tests/hello 42
	boot
}

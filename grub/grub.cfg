set timeout=0
# 1 boots the interactive tests (they wait for typing); keep 0 otherwise
set default=0

# Modules: module2 <file on the ISO> <name> [expected exit status]
# The name is the program's install path; the kernel runs every module in this
# order and compares its exit status with the expected one (0 when omitted).
# At most BOOT_MODULE_MAX (kernel/include/boot_info.h) modules per entry.
# hello must be in every entry: the ELF self-test loads it.
menuentry "MadeInHeavenOS" {
	multiboot2 /boot/mihos.kernel
	module2 /boot/usr/tests/hello.elf /usr/tests/hello 42
	module2 /boot/usr/tests/stdio.elf /usr/tests/stdio
	module2 /boot/usr/tests/brk.elf /usr/tests/brk
	module2 /boot/usr/tests/malloc.elf /usr/tests/malloc
	module2 /boot/usr/tests/malloc_abort.elf /usr/tests/malloc_abort 134
	module2 /boot/usr/tests/stdin.elf /usr/tests/stdin
	boot
}

menuentry "MadeInHeavenOS (interactive tests)" {
	multiboot2 /boot/mihos.kernel
	module2 /boot/usr/tests/hello.elf /usr/tests/hello 42
	module2 /boot/usr/tests/stdin_interactive.elf /usr/tests/stdin_interactive
	boot
}

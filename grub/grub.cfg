# The menu shows for 5 seconds, then boots the default: 0 automatic tests
# (they end by halting), 1 interactive tests (they wait for typing), 2 shell.
set timeout=5
set default=0

# multiboot2 <kernel> <init's arguments>: the kernel starts /sbin/init from the
# initrd with the command line as its arguments. "once <command>" runs the
# command and halts, "respawn <command>" restarts it forever.
# module2 /boot/initrd.tar initrd: every program, as one tar archive (built
# from the sysroot by grub/Makefile); the kernel finds it by the name "initrd".
menuentry "MadeInHeavenOS" {
	multiboot2 /boot/mihos.kernel once /usr/tests/run
	module2 /boot/initrd.tar initrd
	boot
}

menuentry "MadeInHeavenOS (interactive tests)" {
	multiboot2 /boot/mihos.kernel once /usr/tests/run interactive
	module2 /boot/initrd.tar initrd
	boot
}

menuentry "MadeInHeavenOS (shell)" {
	multiboot2 /boot/mihos.kernel respawn /bin/sh
	module2 /boot/initrd.tar initrd
	boot
}

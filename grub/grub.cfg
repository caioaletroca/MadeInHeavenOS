# The menu shows for 5 seconds, then boots the default: the automatic tests
# (they end by halting). The other entries: the interactive tests (they wait
# for typing), the shell, and the tests and the shell from the disk.
set timeout=5
set default=tests

# A scripted run picks its entry with no menu: run-tests.sh starts QEMU with
# -smbios type=1,product=mihos-entry:<id> (the SMBIOS product name, string 5
# of the type 1 table). Bochs and real machines have their own product name,
# so they get the menu.
insmod smbios
insmod regexp
if smbios --type 1 --get-string 5 --set product; then
	if regexp --set 1:entry '^mihos-entry:(.+)$' "$product"; then
		set default="$entry"
		set timeout=0
	fi
fi

# multiboot2 <kernel> [name=value ...] <init's arguments>: the leading
# name=value words are the kernel's (root=), the rest is /sbin/init's command
# line: "once <command>" runs the command and halts, "respawn <command>"
# restarts it forever.
# module2 /boot/initrd.tar initrd: every program, as one tar archive (built
# from the sysroot by grub/Makefile); the kernel finds it by the name "initrd"
# and mounts it as / when there is no root=.
menuentry "MadeInHeavenOS" --id tests {
	multiboot2 /boot/mihos.kernel once /usr/tests/run
	module2 /boot/initrd.tar initrd
	boot
}

menuentry "MadeInHeavenOS (interactive tests)" --id interactive {
	multiboot2 /boot/mihos.kernel once /usr/tests/run interactive
	module2 /boot/initrd.tar initrd
	boot
}

menuentry "MadeInHeavenOS (shell)" --id shell {
	multiboot2 /boot/mihos.kernel respawn /bin/sh
	module2 /boot/initrd.tar initrd
	boot
}

# From the disk: / is the ext2 on part.img's partition 1 (the installed
# system), and no initrd is loaded. hdb1 is QEMU's name (part.img as the
# primary slave); in Bochs, with part.img as ata1-master, it is hdc1.
# "disk" tells the test runner which boot its tests run in.
menuentry "MadeInHeavenOS (tests, from disk)" --id tests-disk {
	multiboot2 /boot/mihos.kernel root=hdb1 once /usr/tests/run disk
	boot
}

menuentry "MadeInHeavenOS (shell, from disk)" --id shell-disk {
	multiboot2 /boot/mihos.kernel root=hdb1 respawn /bin/sh
	boot
}
